<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirLabs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
        background: linear-gradient(135deg, #0d6efd, #6ea8fe);
        color: #fff;
        }
        .page-header {
        text-align: center;
        margin: 60px 0 30px;
        }
        .card-custom {
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 20px;
        background: #fff;
        color: #000;
        }
        .table thead {
        background: #0d6efd;
        color: #fff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">✈ AirLabs</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/airlines}">Airlines</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/flights}">Flights</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/airports}">Airports</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container text-center" style="margin-top:100px;">
    <div class="card-custom">
        <h1 class="text-danger">⚠ Error</h1>
        <h2 th:text="${status}"></h2>
        <a th:href="@{/}" class="btn btn-primary mt-3">Back Home</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
